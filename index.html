<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>딥테크 정부지원사업 계획서 생성기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">🏛️ 딥테크 정부지원사업 계획서 생성기</div>
    <div class="proj-controls">
      <select id="projectSelect" title="프로젝트 선택"></select>
      <button id="btnNewProject" class="btn small">＋ 새 프로젝트</button>
      <button id="btnDeleteProject" class="btn small danger">삭제</button>
      <span id="saveStatus" class="save-status"></span>
    </div>
  </header>

  <div id="layout">
    <nav id="sidebar">
      <div class="step-list" id="stepList"></div>
      <div class="sidebar-footer">
        <p>API 키 불필요 · 데이터는 이 브라우저에만 저장</p>
      </div>
    </nav>
    <main id="main"></main>
  </div>

  <script src="js/vendor/docx.iife.js"></script>
  <script src="js/vendor/pptxgen.bundle.js"></script>
  <!-- pdf.js: 워커를 같은 페이지에 포함해 blob·eval 없이 동작시킨다 -->
  <script src="js/vendor/pdf.worker.min.js"></script>
  <script src="js/vendor/pdf.min.js"></script>
  <script src="js/vendor/cmaps-ko.js"></script>
  <script src="js/fileparse.js"></script>
  <script src="js/programs.js"></script>
  <script src="js/prompts.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
